    { type: "Data Matching", question: "How many of the five items match? Left: 114 N. Maple Dr.; 55 Greenfield Ct.; 3201 Gardner St.; 24 Walker Rd.; 8 Whitehurst Ln. | Right: 114 Maple Dr.; 55 Greenfield Ct.; 3201 Gardner Rd.; 24 Walker Rd.; 8 Whitehurst Ln.", answer: "3 (55 Greenfield Ct., 24 Walker Rd., and 8 Whitehurst Ln. match)" },
    { type: "Data Matching", question: "How many of the five items match? Left: Frye & Cho's Pet Supply Co.; IntelliComCo Inc.; Harvey Dental; Fowler Construction Co.; Vicksburg Lighting | Right: Frye & Cho's Pet Supply Co.; IntelliComCo Inc.; Harvey Dental; Fowler Construction Co.; Vicksburg Lighting", answer: "5 (all five items match)" },

    { type: "Data Matching", question: "How many of the five items match? Left: Corvalis Manufacturing Co.; Hastings Insurance; Feldman Productions; Brown & Ellis Consulting, Inc.; Sylvan & de Young Law Firm | Right: Corvalis Manufacturing Corp.; Hastings Insurance; Feldman Production; Brown & Ellison Consulting, Inc.; Sylvan & De Young Law Firm", answer: "2 (Hastings Insurance matches; Sylvan & de Young / De Young is debatable)" },
];

const TYPE_CONFIG = {
    "Analogies":          { cssKey: "analogies",      label: "Analogies" },
    "Word Meaning":       { cssKey: "word-meaning",   label: "Word Meaning & Sentence Completion" },
    "Antonyms":           { cssKey: "antonyms",       label: "Nearest Opposite (Antonyms)" },
    "Logical Deduction":  { cssKey: "logical",        label: "Logical Deduction" },
    "Word/Letter Series": { cssKey: "series",         label: "Word / Letter Series" },
    "Data Matching":      { cssKey: "data-matching",  label: "Data Matching" }
};

const searchInput  = document.getElementById('search-input');
const clearBtn     = document.getElementById('clear-btn');
const resultsEl    = document.getElementById('results-container');
const statsBar     = document.getElementById('stats-bar');

function escapeRegex(str) {
    return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

function highlight(text, pattern) {
    if (!pattern) return escapeHtml(text);
    const parts = escapeHtml(text).split(new RegExp(`(${escapeRegex(escapeHtml(pattern))})`, 'gi'));
    return parts.map(p => p.toLowerCase() === pattern.toLowerCase() ? `<mark>${p}</mark>` : p).join('');
}

function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function search(query) {
    const q = query.trim();
    clearBtn.style.display = q ? 'block' : 'none';

    if (!q) {
        statsBar.textContent = '';
        resultsEl.innerHTML = `
            <div class="welcome">
                <div class="emoji">🎯</div>
                <p>Start typing above to instantly search across <strong>all</strong> CAT verbal reasoning questions.<br>
                Questions, answers, and categories are all searchable.</p>
            </div>`;
        return;
    }

    const lower = q.toLowerCase();
    const matched = QUESTIONS.filter(item =>
        item.question.toLowerCase().includes(lower) ||
        item.answer.toLowerCase().includes(lower) ||
        item.type.toLowerCase().includes(lower)
    );

    if (matched.length === 0) {
        statsBar.textContent = '';
        resultsEl.innerHTML = `
            <div class="no-results">
                <div class="emoji">🤷</div>
                <p>No questions found for <strong>"${escapeHtml(q)}"</strong>.<br>Try different keywords.</p>
            </div>`;
        return;
    }

    statsBar.textContent = `${matched.length} result${matched.length !== 1 ? 's' : ''} found`;

    // Group by type in original order
    const groups = new Map();
    for (const item of matched) {
        if (!groups.has(item.type)) groups.set(item.type, []);
        groups.get(item.type).push(item);
    }

    let html = '';
    for (const [type, items] of groups) {
        const cfg = TYPE_CONFIG[type] || { cssKey: 'analogies', label: type };
        html += `<div class="section-header">${escapeHtml(cfg.label)}</div>`;
        for (const item of items) {
            html += `
            <div class="result-card card-${cfg.cssKey}">
                <span class="type-badge badge-${cfg.cssKey}">${escapeHtml(type)}</span>
                <div class="question-text">${highlight(item.question, q)}</div>
                <div class="answer-text"><span class="answer-label">→</span><span>${highlight(item.answer, q)}</span></div>
            </div>`;
        }
    }

    resultsEl.innerHTML = html;
}

searchInput.addEventListener('input', () => search(searchInput.value));

clearBtn.addEventListener('click', () => {
    searchInput.value = '';
    clearBtn.style.display = 'none';
    statsBar.textContent = '';
    search('');
    searchInput.focus();
});
</script>
</body>
